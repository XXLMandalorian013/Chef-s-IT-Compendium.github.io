# Global reference for vrrp.
global_defs {
    # Friendly name for this device in the logs.
    router_id YourPiNameHere
    # Makes the vrrp_script run as an unprivileged user instead of root. Must make this service account though. (useradd -r -s /usr/sbin/nologin keepalived_script)
    enable_script_security
    # The SA the vrrp_script will used over root when enable_script_security is specified.
    script_user keepalived_script_sa
}
# VRRP health check script. Will be referenced in the vrrp_instance. With an interval 5 and fall 3, a dead Pi-hole is noticed after roughly 15 seconds.
# Faster checks might lead to false positives.
vrrp_script check_pihole {
    # Path to where your script will live.
    script "/usr/local/bin/check_pihole.sh"
    # X seconds keepalived waits between runs of the check script.
    interval 5
    # X failed checks in a row before the node is considered unhealthy.
    fall 3
    # X successes before it’s considered healthy again.
    rise 2
    # Treat the check as failed until it has passed once, so a freshly booted primary doesn't take the VIP before Pi-hole and Unbound are ready.
    init_fail
    # Total time the script is allowed to run in seconds before its stopped if it never completed.
    timeout 5
}
# Defining the VRRP section.
vrrp_instance VI_1 {
    # Set as MASTER for primary Pi and BACKUP for secondary Pi.
    state MASTER
    # A Pi ethernet name, that KeepAliveD is watching.
    interface eth0
    # This vrrp's instance ID. Any number from 1 to 255, but it must be identical on both Pis instance and not conflict with existing vrrp clusters on your LAN.
    virtual_router_id 13
    # An election on who has what role or what role they go back to, from a failure state. 150 = MASTER Pi, 100 = BACKUP Pi.
    priority 150
    # Pis check ins w/ vrrp, in seconds.
    advert_int 1
    # Whenever a Pi becomes MASTER, it sends gratuitous ARPs right away to announce the VIP. This sends a second round after the delay (in seconds), 
    # to catch clients and the router that missed the first one or still have the old MAC cached. 0 = off, 5-8 = happy medium 10-30 for slower switches and routers but keeps
    # clients broken longer.
    garp_master_delay 8
    # VRRP protocol version, 2 (RFC3768) or 3 (RFC5798). Ensure its the same version on both Pis. 2 = IPv4 only and for older gear that can only handle v2 VRRP.
    #3 = IPv4 and 6. 3 uses centisecond advertisement intervals, so failover can be faster, and it dropped the protocol-level authentication.
    version 3
    # Only needed for VRRP 2.
    #authentication {
        #auth_type PASS
        #auth_pass secret
    #}
    # The actual vrrp virtual IP address. Must be the same subnet as the Pis and what you should have already reserved in your DHCP scope.
    virtual_ipaddress {
        YourLANIPHere/24
    }
    # Unicast adverts between Pis instead of multicast. Allows the Pis to talk directly to each over over multicast.
    # This Pis actual IP.
    unicast_src_ip YourLANIPHere
    # The inverse Pis IP that this Pi will talk to.
    unicast_peer {
        YourOtherLANIPHere
    }
    # The health check script above vrrp is referencing above.
    track_script {
        check_pihole
    }
}


