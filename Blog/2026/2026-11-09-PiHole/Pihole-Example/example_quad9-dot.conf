# Unbound .conf file. This forwards DNS right to 9s over DoT.
server:
    # If no logfile is specified, syslog is used. If syslog is used, by default, 10% of the filesystem, up to 4 GB is filled before rolling over.
    # Modify this if you choose in /etc/systemd/journald.conf and restart systemd-journald.
    # The path below is commented out as I wished to use syslog.
    # logfile: "/var/log/unbound/unbound.log"
    verbosity: 0
    # So local queries on the Pi can be handled by unbound.
    interface: 127.0.0.1@5335
    # This Pis actual IP + unbound port.
    interface: YourLANIPHere@5335
    # Allow queries from the Pi itself (dig tests, check_pihole.sh).
    access-control: 127.0.0.0/8 allow
    # Allow queries from Docker containers (the Pi-hole container).
    access-control: 172.16.0.0/12 allow
    # Handle IPv4 traffic.
    do-ip4: yes
    # Handle UDP traffic.
    do-udp: yes
    # Handle TCP traffic.
    do-tcp: yes
    # Handle IPv6 traffic.
    do-ip6: no
    # Which address family it tries first when an upstream DNS server offers IPv4 and 6. Set no if you don't use IPv6.
    prefer-ip6: no
    #  section to prevent a possible boot-time race condition where Unbound fails to start because it tries to bind to a local IP address that the operating system hasn't fully initialized yet.
    ip-freebind: yes
    # Comment out if you end up forwarding DNS to a DNS provider like 9.9.9.9.
    # Needed if recursed over forwarding is used. Raspberry Pi OS's/Debian's dns-root-data package will supply this list.
    # Note, dns-root-data list is updated with sudo apt upgrade.
    #root-hints: "/var/lib/unbound/root.hints"
    # Helps prevent DNS cache poisonings.
    harden-glue: yes
    # Helps prevent DNSSec downgrade attacks.
    harden-dnssec-stripped: yes
    # If forwarding comment out. If recursing, use it.
    # Don't use Capitalization randomization as it known to cause DNSSEC issues sometimes.
    # see https://discourse.pi-hole.net/t/unbound-stubby-or-dnscrypt-proxy/9378 for further details
    #use-caps-for-id: no
    # DNS software vendors and big resolver operators agreed on a default advertise buffer size, 1232-byte. (DNS Flag Day 2020).
    # Helps prevent DNS cache poisonings and Firewall drops.
    # It’s derived from IPv6 numbers but applies to IPv4 and 6.
    edns-buffer-size: 1232
    # Perform prefetching of close to expired message cache entries of frequently queried.
    prefetch: yes
    # Number of workers on the DNS server.
    # One thread should be sufficient. Will eat more RAM if changed to say 2 for almost no gain for a SOHO, single/low hardware speced device/networks.
    num-threads: 1
    # The size of the kernel buffer for incoming UDP queries. If a burst arrives faster than Unbound can read it, it might get dropped and the client will have to try again.
    #  m = megabyte k = kilobyte. Comment this out, unless you are an ISP, a company or campus network, or a public resolver, where thousands of queries per second come in.
    #so-rcvbuf: 1m
    # DNS Rebinding protection: strips private IPs from answers for public names.
    #Ensures privacy/resolution of local IP ranges for any home hosted external facing services and DNS rebinding protection,
    # where DNSSEC drops bogus answers on the specified domain and ranges. Those six lines cover the private and local ranges. Add private domains as needed.
    #private-domain: "yourdomain.com"
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10
    # TailScale.
    private-address: 100.64.0.0/10
    # RFC6303 4.2 - Ensure no reverse queries to non-public IP ranges. Entries covering documentation, broadcast, and test ranges.
    private-address: 192.0.2.0/24
    private-address: 198.51.100.0/24
    private-address: 203.0.113.0/24
    private-address: 255.255.255.255/32
    private-address: 2001:db8::/32
    # CA certificates used to verify the DoT upstream's TLS certificate as I will be forwarding to 9.9.9.9.
    # It already exists as its the system’s standard CA bundle.
    tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt
# Forward all queries to Quad9 over DNS-over-TLS (port 853).
forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net


